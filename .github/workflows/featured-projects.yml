name: Update featured projects
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Test generator and section boundaries
        run: node --test automation/featured-projects.test.mjs
      - name: Update featured projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node automation/featured-projects.mjs
      - name: Commit only when projects changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No project changes; no commit needed."
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m "chore: update featured projects"
          git pull --rebase origin main
          git push origin HEAD:main
